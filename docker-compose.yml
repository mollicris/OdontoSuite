version: '3.9'

services:
  postgres:
    image: postgres:15-alpine
    container_name: odontosuite-db
    environment:
      POSTGRES_USER: odonto
      POSTGRES_PASSWORD: password
      POSTGRES_DB: odontosuite
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odonto"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: odontosuite-cache
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: odontosuite-api
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://odonto:password@postgres:5432/odontosuite
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      JWT_EXPIRATION: 24h
      CORS_ORIGIN: http://localhost:5173
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: npm run start:dev

  mailhog:
    image: mailhog/mailhog:latest
    container_name: odontosuite-mail
    ports:
      - '1025:1025'
      - '8025:8025'

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: odontosuite-network
